services:
  - type: web
    name: pope-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate && gunicorn -c gunicorn_config.py config.wsgi
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: NUM_PROXIES
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"
